version: '3.5'
networks:
  monitor-net:
    driver: bridge
services:
  # api.300sf.se
  albatross:
    container_name: albatross
    network_mode: host
    build:
      context: ../300sf
      dockerfile: Dockerfile
      args:
        CONFIG_FILE: 300sf-albatross.conf
    restart: unless-stopped
    environment:
      - "LOG_FILE_LOCATION=/logs/albatross.log"
      - "DATA_STORAGE_PATH=/resources/"
    volumes:
      - /home/klarre/logs:/logs
  # api.300sf.se
  blackbird:
    container_name: blackbird
    network_mode: host
    build:
      context: ../300sf
      dockerfile: Dockerfile
      args:
        CONFIG_FILE: 300sf-blackbird.conf
    restart: unless-stopped
    environment:
      - "LOG_FILE_LOCATION=/logs/blackbird.log"
      - "DATA_STORAGE_PATH=/resources/"
    volumes:
      - /home/klarre/logs:/logs
  # app.300sf.se
  yellowhammer:
    container_name: yellowhammer
    network_mode: host
    build:
      context: ../300sf-webapp
      dockerfile: Dockerfile
    restart: unless-stopped
  # 300sf.se
  woodpecker:
    container_name: woodpecker
    network_mode: host
    build:
      context: ../300sf-web
      dockerfile: Dockerfile
    restart: unless-stopped
