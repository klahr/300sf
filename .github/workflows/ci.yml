name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...

  # The API against a real database and Redis: the schema from db.sql, every
  # query run for real. See server/db_test.go.
  server-db:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: 300sf
        ports:
          - 127.0.0.1:33306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 127.0.0.1:36379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DATA_SOURCE: "root:test@tcp(127.0.0.1:33306)/300sf?charset=utf8mb4&parseTime=True&loc=Local"
      TEST_REDIS: "127.0.0.1:36379"
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      # MariaDB's own client, so the schema loads as it does in production.
      - name: Load the schema
        run: docker run --rm -i --network host mariadb:11 mariadb -h127.0.0.1 -P33306 -uroot -ptest 300sf < db.sql
      - run: go test -run '^TestDB' -count=1 -v .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Translations.ts is generated from translations/locale/*.json; edit those.
      - run: npm run translations && git diff --exit-code src/Translations.ts
      - run: mkdir -p ../server/site/static/js && npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The tags, for the version git describe stamps into the build.
          fetch-depth: 0
      - run: docker build --build-arg VERSION="$(git describe --tags --always)" -t 300sf .
