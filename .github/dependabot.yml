# Weekly pull requests for outdated dependencies, grouped so they come as one
# per ecosystem.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # TypeScript 7 drops module System and outFile, which the build uses.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directories: ["/", "/analyzer"]
    schedule:
      interval: monthly
    ignore:
      # Odd Node releases are short-lived; stay on the LTS ones.
      - dependency-name: node
        versions: ["25", "25-alpine", "27", "27-alpine"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
