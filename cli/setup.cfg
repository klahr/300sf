[metadata]
name = 300sf
version = 0.1.0
author = Joachim Klahr
author_email = klarre@unix-like.se
description = Command line client for the 300sf API
long_description = file: README.md
long_description_content_type = text/markdown
license = AGPL-3.0-or-later
license_files = LICENSE
url = https://github.com/klahr/300sf

[options]
package_dir =
    = src
packages = klahr
python_requires = >=3.9
install_requires =
    httpx
    tabulate
    pyyaml

[options.entry_points]
console_scripts =
    300sf = klahr.cli:main
