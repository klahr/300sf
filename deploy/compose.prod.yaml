# Production overlay: run the image CI publishes to ghcr.io for each release
# tag instead of building on this host, so a small server is enough. The
# analyzer is left out unless asked for (--profile analyzer); BirdNET needs
# more memory than a small server has.
#
# Enable it once in deploy/.env:
#
#   COMPOSE_FILE=docker-compose.yml:compose.prod.yaml
#
# make upgrade then pulls the newest release and pins it as VERSION in
# deploy/.env, so a bare `docker compose up -d` keeps running it.
services:
  300sf:
    image: ghcr.io/klahr/300sf:${VERSION:-latest}

  analyzer:
    profiles: [analyzer]
