# Production: one container serves everything on 300sf.se (landing page, app,
# API and docs) and redirects the old domains. A reverse proxy on the host
# terminates TLS; see README.md in this directory.
services:
  300sf:
    container_name: 300sf
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    # MariaDB and Redis run on the host.
    network_mode: host
    volumes:
      - ${CONFIG_FILE:-/etc/300sf/300sf.yml}:/config/300sf.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${PORT:-8090}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Bird sound identification (BirdNET). Set site.analyze-endpoint to
  # http://127.0.0.1:8095/analyze to use it; leave it empty to disable the feature.
  analyzer:
    container_name: 300sf-analyzer
    build:
      context: ../analyzer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8095:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
