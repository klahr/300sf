# Production stack. Build contexts are the sibling directories of this
# monorepo; the API's CONFIG_FILE must exist (untracked) in api/.
services:
  # api.300sf.se
  albatross:
    container_name: albatross
    network_mode: host
    build:
      context: ../api
      dockerfile: Dockerfile
      args:
        CONFIG_FILE: 300sf-albatross.conf
    restart: unless-stopped
    environment:
      - "LOG_FILE_LOCATION=/logs/albatross.log"
    volumes:
      - /home/klarre/logs:/logs
  # api.300sf.se
  blackbird:
    container_name: blackbird
    network_mode: host
    build:
      context: ../api
      dockerfile: Dockerfile
      args:
        CONFIG_FILE: 300sf-blackbird.conf
    restart: unless-stopped
    environment:
      - "LOG_FILE_LOCATION=/logs/blackbird.log"
    volumes:
      - /home/klarre/logs:/logs
  # app.300sf.se
  yellowhammer:
    container_name: yellowhammer
    network_mode: host
    build:
      context: ../webapp
      dockerfile: Dockerfile
    restart: unless-stopped
  # 300sf.se
  woodpecker:
    container_name: woodpecker
    network_mode: host
    build:
      context: ../web
      dockerfile: Dockerfile
    restart: unless-stopped
  # api-docs.300sf.se
  swagger-ui:
    image: swaggerapi/swagger-ui
    ports:
      - "8070:8080"
    environment:
      - SWAGGER_JSON=/foo/swagger.yaml
    volumes:
      - ../api:/foo
