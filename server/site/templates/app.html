<!DOCTYPE html>
<html lang="{{.Lang}}">

<head>
	{{template "app-head" .}}
	<link rel="preload" as="style" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" onload="this.rel='stylesheet'">
	<script async src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
		integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
	<script defer src="https://code.jquery.com/jquery-3.7.1.min.js"
		integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
	<script async src='https://js.stripe.com/v3/buy-button.js'></script>
</head>

<body>
	<div id="loading" class="loading"></div>
	<div id="root" class="background">
		<script defer type="text/javascript" src="/js/app.js"></script>
		<script type="text/javascript">
			let promptEvent = null;

			window.addEventListener("beforeinstallprompt", (event) => {
				promptEvent = event;
				event.preventDefault();
			});

			function showA2HSPrompt() {
				promptEvent.prompt();
				promptEvent.userChoice.then(handleA2HSResponse);
			}

			function onAppStart() {
				const boot = {{.Boot}};
				new App(boot.language, boot.redirect, boot.queryParameters);
			}

			document.querySelector('script[src="/js/app.js"]').onload = onAppStart;
		</script>
	</div>

	<script>
		if ("serviceWorker" in navigator) {
			navigator.serviceWorker.register("/sw.js").then(reg => {
				reg.update();
			});
		}
	</script>
</body>

</html>
