<!DOCTYPE html>
<html lang="{{.Lang}}">

<head>
	{{template "app-head" .}}
	<link rel="preload" as="style" href="/vendor/leaflet/leaflet.css" onload="this.rel='stylesheet'">
	<script async src="/vendor/leaflet/leaflet.js"></script>
	<script defer src="/vendor/jquery/jquery-3.7.1.min.js"></script>
</head>

<body>
	<div id="loading" class="loading"></div>
	<div id="root" class="background">
		<script defer type="text/javascript" src="/js/app.js"></script>
		<script type="text/javascript">
			let promptEvent = null;

			window.addEventListener("beforeinstallprompt", (event) => {
				promptEvent = event;
				event.preventDefault();
			});

			function showA2HSPrompt() {
				promptEvent.prompt();
				promptEvent.userChoice.then(handleA2HSResponse);
			}

			function onAppStart() {
				const boot = {{.Boot}};
				new App(boot.language, boot.redirect, boot.queryParameters);
			}

			document.querySelector('script[src="/js/app.js"]').onload = onAppStart;
		</script>
	</div>

	<script>
		if ("serviceWorker" in navigator) {
			navigator.serviceWorker.register("/sw.js").then(reg => {
				reg.update();
			});
		}
	</script>
</body>

</html>
