<!DOCTYPE html>
<html lang="{{.Lang}}">

<head>
	{{template "app-head" .}}
	<link rel="preload" as="style" href="{{asset "/vendor/leaflet/leaflet.css"}}" onload="this.rel='stylesheet'">
	<script async src="{{asset "/vendor/leaflet/leaflet.js"}}"></script>
	<script defer src="{{asset "/vendor/jquery/jquery-3.7.1.min.js"}}"></script>
</head>

<body>
	<div id="loading" class="loading"></div>
	<div id="root" class="background">
		<script defer type="text/javascript" id="app-js" src="{{asset "/js/app.js"}}"></script>
		<script type="text/javascript">
			let promptEvent = null;

			window.addEventListener("beforeinstallprompt", (event) => {
				promptEvent = event;
				event.preventDefault();
			});

			function showA2HSPrompt() {
				promptEvent.prompt();
				promptEvent.userChoice.then(handleA2HSResponse);
			}

			function onAppStart() {
				const boot = {{.Boot}};
				Maps.configure(boot.mapTiles, boot.mapAttribution);
				new App(boot.language, boot.redirect, boot.queryParameters, boot.version);
			}

			document.getElementById("app-js").onload = onAppStart;
		</script>
	</div>
</body>

</html>
