{{define "app-head"}}
	<meta charset="UTF-8">
	<meta name="viewport"
		content="user-scalable=yes, initial-scale=1, maximum-scale=5, minimum-scale=1, width=device-width, viewport-fit=cover" />
	<meta name="theme-color" content="#0b0a0d" media="(prefers-color-scheme: dark)" />
	<meta name="theme-color" content="#f5f3f7" media="(prefers-color-scheme: light)" />
	<meta name="description" content="{{if eq .Lang "sv"}}Krysslistor för fågelskådare i Sverige.{{else if eq .Lang "de"}}Checklisten für Vogelbeobachter in Schweden.{{else}}Checklists for birders in Sweden.{{end}}" />
	<script>
		// Before the first paint, so a chosen theme never flashes the other one.
		try {
			const theme = localStorage.getItem("theme");
			if (theme === "light" || theme === "dark") {
				document.documentElement.dataset.theme = theme;
			}
		} catch (e) { }
	</script>
	<link rel="stylesheet" href="/css/tokens.css">
	<link rel="stylesheet" href="/css/theme.css">
	<link rel="icon" href="/favicon.png" type="image/x-icon">
	<link rel="icon" href="/favicon.png" type="image/png" sizes="16x16">
	<link rel="manifest" href="/manifest.json" />
	<link rel="stylesheet" href="/css/ui.css">
	<link rel="stylesheet" href="/css/base.css">
	<link rel="stylesheet" href="/css/fonts.css">
	<link rel="stylesheet" href="/css/icons.css">
	<title>{{.Title}}</title>
{{end}}
