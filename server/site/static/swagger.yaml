        "500":
          $ref: "#/components/responses/ServerError"
  /v1/activities/list:
    get:
      tags: [Catalog]
      summary: All activities
      description: Empty on a new server until an admin adds some.
      responses:
        "200":
          $ref: "#/components/responses/NamedRecordList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/activities:
    post:
      tags: [Catalog]
      summary: Create an activity
      description: "**Admin only** (needs the `admin` scope)."
      requestBody:
        $ref: "#/components/requestBodies/NamedRecordCreate"
      responses:
        "200":
          $ref: "#/components/responses/NamedRecordCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  # ---------------------------------------------------------------- Zones
  /v1/zones/list:
    get:
      tags: [Zones]
      summary: All zones
      description: "**Admin only** (needs the `admin` scope). `polygon` is `null`; `parent_zone` is filled in (one level)."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      $ref: "#/components/schemas/Zone"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/zones/{uuid}:
    get:
      tags: [Zones]
      summary: One zone with its polygon
      description: "**Admin only** (needs the `admin` scope). `polygon` is base64 GeoJSON (can be megabytes); `parent_zone` is `null`."
      parameters:
        - $ref: "#/components/parameters/Uuid"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: "#/components/schemas/Zone"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/zones:
    post:
      tags: [Zones]
      summary: Create a zone
      description: |
        **Admin only** (needs the `admin` scope). The whole request is limited to 1 MiB. An unknown
        `parent_zone_uuid` is ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, polygon, admin_level]
              properties:
                name:
                  $ref: "#/components/schemas/Translation"
                polygon:
                  type: string
                  description: GeoJSON as text.
                admin_level:
                  type: integer
                  minimum: 1
                  maximum: 10
                  description: 2 country, 4 county, 7 municipality, 10 habitat.
                parent_zone_uuid:
                  type: string
      responses:
        "200":
          description: The new zone (bare). `name` is empty and `parent_zone` is `null` in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zone"
        "400":
          description: Parse error (2001), level out of range, or invalid polygon (-10001).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/zones/regions:
    get:
      tags: [Zones]
      summary: Counties in a map view
      description: Counties (`admin_level` 4) whose bounds meet the box, max 200, with a simplified outline.
      parameters:
        - name: bbox
          in: query
          required: true
          description: "`west,south,east,north` in degrees."
          schema:
            type: string
            example: "11.0,55.3,24.2,69.1"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionZonesResult"
        "400":
          description: Invalid bbox (2001).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/zones/search:
    get:
      tags: [Zones]
      summary: Search regions by name
      description: |
        Searches OpenStreetMap. Results have `osm_id` and `country`, and `uuid` only when the zone already exists;
        no `outline`. Shares a throttle of 10 a minute per user with `POST /v1/zones/osm` (429 without code).
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionZonesResult"
        "400":
          description: "`q` must be 2 to 100 characters (2001)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/zones/osm:
    post:
      tags: [Zones]
      summary: Get or create the zone for an OpenStreetMap region
      description: Creates the zone (and its country) if needed. Shares the zone search throttle.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [osm_id]
              properties:
                osm_id:
                  type: string
                  example: R54220
      responses:
        "200":
          description: The zone (bare).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionZone"
        "400":
          description: Missing `osm_id` (2001).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/Unavailable"

  # ---------------------------------------------------------------- Competitions
  /v1/competitions:
    post:
      tags: [Competitions]
      summary: Create a competition
      description: |
        A participant's score is the number of distinct species seen in `[from, until)`, limited to the template's
        species and the counties when given. With counties, only sightings with a position inside one count; a
        sighting without a position never does. Errors are `{"code": -10001, "message": …}`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, from, until]
              properties:
                name:
                  $ref: "#/components/schemas/Translation"
                description:
                  $ref: "#/components/schemas/Translation"
                from:
                  type: string
                  format: date-time
                  description: At most a year ago, before `until`.
                until:
                  type: string
                  format: date-time
                  description: Exclusive end; in the future, at most five years after `from`.
                list_template_uuid:
                  type: string
                  description: '`""` means all species count.'
                end_on_reports:
                  type: integer
                  minimum: 0
                  description: First to this many species wins; 0 for no limit.
                max_competitors:
                  type: integer
                  description: 0 for unlimited; 1 and negative values are rejected.
                visibility:
                  type: integer
                  enum: [0, 2]
                color:
                  type: string
                  maxLength: 16
                competition_zones_uuids:
                  type: array
                  description: County zones (`admin_level` 4).
                  items:
                    type: string
                password:
                  type: string
                  maxLength: 64
                creator_join:
                  type: boolean
      responses:
        "200":
          description: The competition (bare), with standings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionInfo"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/competitions/list:
    get:
      tags: [Competitions]
      summary: Open public competitions
      description: Public, not archived, still open to join; by `from`, max 50. `standings` is `null`.
      responses:
        "200":
          $ref: "#/components/responses/CompetitionsResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/competitions/list/me:
    get:
      tags: [Competitions]
      summary: Your competitions
      description: Created, joined or invited to; not archived; by `until` descending, max 100. `standings` is `null`.
      responses:
        "200":
          $ref: "#/components/responses/CompetitionsResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/competitions/basis:
    get:
      tags: [Competitions]
      summary: Everything the create-competition form needs
      responses:
        "200":
          description: Bare object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  zones:
                    type: array
                    description: All counties.
                    items:
                      $ref: "#/components/schemas/Zone"
                  list_templates:
                    type: array
                    description: Your own and public templates with their species count.
                    items:
                      type: object
                      properties:
                        uuid:
                          type: string
                        name:
                          $ref: "#/components/schemas/Translation"
                        description:
                          $ref: "#/components/schemas/Translation"
                        size:
                          type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/competitions/{uuid}:
    get:
      tags: [Competitions]
      summary: One competition
      description: |
        `standings` is filled in when the competition is public or you are joined, invited or the creator.
        Private competitions you have no part in are not found.
      parameters:
        - $ref: "#/components/parameters/Uuid"
      responses:
        "200":
          description: Bare object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/competitions/{uuid}/result:
    get:
      tags: [Competitions]
      summary: Standings of a public competition
      description: No token needed. Public competitions only, seen anonymously (`joined` etc. false, `me` false).
      security: []
      parameters:
        - $ref: "#/components/parameters/Uuid"
      responses:
        "200":
          description: Bare object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitionInfo"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/competitions/{uuid}/join:
    put:
      tags: [Competitions]
      summary: Join a competition
      description: |
        Also accepts a pending invite. The password is needed when `has_password` is true, unless you were invited.
        Wrong passwords are throttled to 10 an hour (429 code 7003).
      parameters:
        - $ref: "#/components/parameters/Uuid"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
      responses:
        "200":
          $ref: "#/components/responses/EmptyObject"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Wrong password (9001).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Finished, not open for joining, or full.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/competitions/{uuid}/leave:
    put:
      tags: [Competitions]
      summary: Leave a competition
      parameters:
        - $ref: "#/components/parameters/Uuid"
      responses:
        "200":
          $ref: "#/components/responses/EmptyObject"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/competitions/{uuid}/invite:
    put:
      tags: [Competitions]
      summary: Invite users by username
      description: |
        Participants and the creator can invite while the competition is not finished. A leading `@` is trimmed.
        Throttled to 20 calls an hour per user (429 code 7003).
      parameters:
        - $ref: "#/components/parameters/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [usernames]
              properties:
                usernames:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: string
      responses:
        "200":
          description: Bare object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  invited:
                    type: array
                    description: Invited now, or already invited and not yet answered.
                    items:
                      type: string
                  already_in:
                    type: array
                    description: Already taking part; not invited.
                    items:
                      type: string
                  not_found:
                    type: array
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Only participants can invite.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The competition has finished.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/competitions/{uuid}/decline:
    put:
      tags: [Competitions]
      summary: Decline an invite
      parameters:
        - $ref: "#/components/parameters/Uuid"
      responses:
        "200":
          $ref: "#/components/responses/EmptyObject"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/competitions/{uuid}/archive:
    put:
      tags: [Competitions]
      summary: Remove a competition
      description: Only the creator.
      parameters:
        - $ref: "#/components/parameters/Uuid"
      responses:
        "200":
          $ref: "#/components/responses/EmptyObject"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Only the creator can remove the competition.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ---------------------------------------------------------------- Announcements
  /v1/announcements/feed:
    get:
      tags: [Announcements]
      summary: News feed
      description: |
        Published posts, newest first. Page with `before` (the uuid of the last post you have). Posts published
        before the account was created count as read. Note the envelope: `{data, more}` without `message`.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 50
        - name: before
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/NewsPost"
                  more:
                    type: boolean
        "400":
          description: Unknown `before` post (1001).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/announcements/list:
    get:
      tags: [Announcements]
      summary: Unread news
      description: Unread published posts from after sign-up, newest first, max 50.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/NewsPost"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/announcements/{uuid}/read:
    put:
      tags: [Announcements]
      summary: Mark a post read
      parameters:
        - $ref: "#/components/parameters/Uuid"
      responses:
        "200":
          $ref: "#/components/responses/SuccessNull"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/announcements/read_all:
    put:
      tags: [Announcements]
      summary: Mark all posts read
      responses:
        "200":
          $ref: "#/components/responses/SuccessNull"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/announcements/all:
    get:
      tags: [Announcements]
      summary: All posts, drafts included
      description: "**Admin only** (needs the `admin` scope). Newest first, with read counts."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: success
                  data:
                    type: array
                    items:
                      allOf:
                        - $ref: "#/components/schemas/Announcement"
                        - type: object
                          properties:
                            published_at:
                              type: string
                              format: date-time
                            reads:
                              type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/announcements:
    post:
      tags: [Announcements]
      summary: Create a post
      description: "**Admin only** (needs the `admin` scope)."
      requestBody:
        $ref: "#/components/requestBodies/AnnouncementBody"
      responses:
        "200":
          $ref: "#/components/responses/AnnouncementResult"
        "400":
          description: Parse error (2001) or invalid field (1005).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/announcements/{uuid}:
    put:
      tags: [Announcements]
      summary: Update a post
      description: "**Admin only** (needs the `admin` scope). Every field is replaced; `draft` is ignored (use pause/resume)."
      parameters:
        - $ref: "#/components/parameters/Uuid"
      requestBody:
        $ref: "#/components/requestBodies/AnnouncementBody"
      responses:
        "200":
          $ref: "#/components/responses/AnnouncementResult"
        "400":
          description: Parse error (2001) or invalid field (1005).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags: [Announcements]
      summary: Delete a post
      description: "**Admin only** (needs the `admin` scope). 200 also for unknown uuids."
      parameters:
        - $ref: "#/components/parameters/Uuid"
      responses:
        "200":
          $ref: "#/components/responses/SuccessNull"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/announcements/{uuid}/pause:
    put:
      tags: [Announcements]
      summary: Take a post down
      description: "**Admin only** (needs the `admin` scope)."
      parameters:
        - $ref: "#/components/parameters/Uuid"
      responses:
        "200":
          $ref: "#/components/responses/SuccessNull"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/announcements/{uuid}/resume:
    put:
      tags: [Announcements]
      summary: Publish a paused post
      description: "**Admin only** (needs the `admin` scope). 404 also when the post is not paused."
      parameters:
        - $ref: "#/components/parameters/Uuid"
      responses:
        "200":
          $ref: "#/components/responses/SuccessNull"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ---------------------------------------------------------------- Notifications, contact
  /v1/notifications/{uuid}/comment:
    post:
      tags: [Notifications]
      summary: Comment on a notification
      description: Only notifications on your own sightings.
      parameters:
        - $ref: "#/components/parameters/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text:
                  type: string
      responses:
        "200":
          description: The comment (bare).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "400":
          description: Parse error (2001), or not found or not yours (-10001).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/contact:
    post:
      tags: [Contact]
      summary: Send a message to the site owners
      description: Replies go to the account's email. Throttled to 5 an hour per user (429 code 7003).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  type: string
                message:
                  type: string
      responses:
        "201":
          description: Sent. The body is the JSON literal `null`.
          content:
            application/json:
              schema:
                nullable: true
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"

  # ---------------------------------------------------------------- Analyze
  /v1/analyze:
    post:
      tags: [Analyze]
      summary: Identify birds in a recording
      description: |
        Multipart upload, max 10 MiB; WAV is the safe format. The identification service's answer is passed
        through as is. Convert `results` to `{name, probability}` objects and send them to
        `PUT /v1/analyze/resolve` to get species. Throttled to 60 an hour per user (429 code 7003).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  format: binary
                meta:
                  type: string
                  description: |
                    JSON text, optional: `num_results` (1–20, default 5), `sensitivity` (0.5–1.5, default 1),
                    `week` (1–48, -1 any), `lat`, `lon`.
                  example: '{"num_results":5,"sensitivity":1,"week":20}'
      responses:
        "200":
          description: The identification service's answer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:
                    type: string
                    example: success
                  results:
                    type: array
                    description: "`[label, confidence]` pairs, best first. The label is `<Scientific name>_<English name>`."
                    items:
                      type: array
                      minItems: 2
                      maxItems: 2
                      items: {}
                    example: [["Turdus merula_Eurasian Blackbird", 0.8123]]
        "400":
          description: 'Missing audio (`{"msg": "missing audio"}`).'
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          description: The identification service is not answering (8001).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Identification is not available (8001).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/analyze/resolve:
    put:
      tags: [Analyze]
      summary: Map identification labels to species
      description: Unmatched labels are dropped; `results` is `null` when nothing matched.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [birds]
              properties:
                birds:
                  type: array
                  maxItems: 50
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        example: "Turdus merula_Eurasian Blackbird"
                      probability:
                        type: number
                        example: 0.8123
      responses:
        "200":
          description: Bare object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        species:
                          $ref: "#/components/schemas/Species"
                        probability:
                          type: number
        "400":
          description: Parse error (-10001) or too many birds (1005).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ---------------------------------------------------------------- Admin
  /v1/invite:
    post:
      tags: [Admin]
      summary: Invite someone by email
      description: "**Admin only** (needs the `admin` scope)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                language_code:
                  type: string
                  enum: [en, sv, de]
      responses:
        "200":
          description: Sent. The body is empty.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/emails/send_all:
    get:
      tags: [Admin]
      summary: Send queued emails
      description: "**Admin only** (needs the `admin` scope). Sends every queued email that is due."
      responses:
        "200":
          description: Bare object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  emails_sent:
                    type: integer
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/translations/list:
    get:
      tags: [Admin]
      summary: All translations
      description: "**Admin only** (needs the `admin` scope). Every name of every record, unpaginated."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  translations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Translation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/translations/update:
    post:
      tags: [Admin]
      summary: Change a translation
      description: |
        **Admin only** (needs the `admin` scope). Renames any record: `uuid` is the translation's uuid
        (`record.name.uuid`). Only non-empty languages are written; `""` does not clear one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Translation"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The `access_token` from `POST /v1/auth`.

  parameters:
    Uuid:
      name: uuid
      in: path
      required: true
      schema:
        type: string
    XAppLanguage:
      name: X-App-Language
      in: header
      required: false
      description: Language for new accounts, emails and Wikipedia texts. Anything else falls back to `en`.
      schema:
        type: string
        enum: [en, sv, de]

  requestBodies:
    NamedRecordCreate:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [name]
            properties:
              name:
                $ref: "#/components/schemas/Translation"
    AnnouncementBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [title, body, color]
            properties:
              title:
                allOf:
                  - $ref: "#/components/schemas/LocalizedText"
                description: "`en` required; each at most 160 characters."
              body:
                allOf:
                  - $ref: "#/components/schemas/LocalizedText"
                description: "`en` required; each at most 10000 characters."
              from:
                type: string
                format: date-time
                nullable: true
                description: Publish time; empty publishes at once.
              until:
                type: string
                format: date-time
                nullable: true
                description: Take-down time, after `from`.
              icon:
                type: string
                pattern: '^[a-z0-9_]{1,32}$'
                default: campaign
                description: A Material Symbols name.
              color:
                type: string
                pattern: '^#[0-9a-fA-F]{6}$'
              draft:
                type: boolean
                description: Create on hold. Ignored on update.

  responses:
    NoContent:
      description: Done. No body.
    EmptyObject:
      description: Done. The body is `{}`.
      content:
        application/json:
          schema:
            type: object
    SuccessNull:
      description: "Done: `{\"message\": \"success\", \"data\": null}`."
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: success
              data:
                type: object
                nullable: true
    BadRequest:
      description: Invalid request, or not found. `code` may be missing.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: |
        No or invalid access token (7001), unknown or revoked API key (3003), or the token lacks the scope (3005).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: missing scope
            code: 3005
    RateLimited:
      description: The API key's daily call limit is used up (3004), or a route throttle was hit (7003).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: too many calls on api key
            code: 3004
    Throttled:
      description: Too many requests from this client (7003).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            message: too many requests, try again later
            code: 7003
    NotFound:
      description: Not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServerError:
      description: Server or database error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: An outside service failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: The feature is turned off on this server.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NamedRecordList:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              result:
                type: array
                items:
                  $ref: "#/components/schemas/NamedRecord"
    NamedRecordCreated:
      description: The new record (bare).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NamedRecord"
    CompetitionsResult:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              result:
                type: array
                items:
                  $ref: "#/components/schemas/CompetitionInfo"
    AnnouncementResult:
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: success
              data:
                $ref: "#/components/schemas/Announcement"

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
          example: missing scope
        code:
          type: integer
          description: See the error code table. Missing on some errors.
          example: 3005
    ZeroTime:
      type: string
      format: date-time
      description: RFC 3339. `"0001-01-01T00:00:00Z"` means unset.
      example: "2026-05-03T07:12:00Z"
    Visibility:
      type: integer
      enum: [0, 1, 2]
      description: |
        0 private, 1 hidden, 2 public. For checklists the API treats hidden and public alike: any signed-in user
        who knows the uuid can read the list (`GET /v1/lists/{uuid}`, not its sightings), and anyone, without a
        token, can compare it (`POST /v1/lists/compare`, or on the website at `/compare?uuids=<uuid>`). No route
        lists other users' checklists.
    Translation:
      type: object
      description: A name in several languages. `""` for a missing language; `la` is the scientific name. `uuid` is ignored on input.
      properties:
        uuid:
          type: string
        sv:
          type: string
        en:
          type: string
        de:
          type: string
        la:
          type: string
      example:
        uuid: abcd234efg
        sv: Sånglärka
        en: Eurasian Skylark
        de: Feldlerche
        la: Alauda arvensis
    LocalizedText:
      type: object
      properties:
        sv:
          type: string
        en:
          type: string
        de:
          type: string
    Language:
      type: object
      properties:
        iso_name:
          type: string
          example: Swedish
        native_name:
          type: string
          example: Svenska
        code:
          type: string
          example: sv
    NamedRecord:
      type: object
      description: An age, gender, method or activity.
      properties:
        uuid:
          type: string
        name:
          $ref: "#/components/schemas/Translation"
    Order:
      type: object
      properties:
        uuid:
          type: string
        name:
          $ref: "#/components/schemas/Translation"
    Species:
      type: object
      properties:
        uuid:
          type: string
        name:
          $ref: "#/components/schemas/Translation"
        order:
          allOf:
            - $ref: "#/components/schemas/Order"
          description: Empty strings where the route does not fill it in.
    Tag:
      type: object
      properties:
        uuid:
          type: string
        name:
          type: string
        color:
          type: string
          description: '`"#rrggbb"` or `""`.'
    Comment:
      type: object
      properties:
        uuid:
          type: string
        text:
          type: string
        edited:
          $ref: "#/components/schemas/ZeroTime"
    Zone:
      type: object
      properties:
        uuid:
          type: string
        name:
          $ref: "#/components/schemas/Translation"
        polygon:
          type: string
          format: byte
          nullable: true
          description: Base64 of the GeoJSON text; `null` where left out.
        admin_level:
          type: integer
          description: 2 country, 4 county, 7 municipality, 10 habitat.
        parent_zone:
          allOf:
            - $ref: "#/components/schemas/Zone"
          nullable: true
    RegionZone:
      type: object
      properties:
        uuid:
          type: string
          description: Left out when no zone exists yet.
        osm_id:
          type: string
          example: R54220
        name:
          $ref: "#/components/schemas/Translation"
        country:
          type: string
        outline:
          type: object
          description: Simplified GeoJSON geometry, `[lon, lat]`.
          properties:
            type:
              type: string
              example: MultiPolygon
            coordinates:
              type: array
              items:
                type: array
                items:
                  type: array
                  items:
                    type: array
                    items:
                      type: number
    RegionZonesResult:
      type: object
      properties:
        result:
          type: array
          items:
            $ref: "#/components/schemas/RegionZone"
    List:
      type: object
      description: A checklist.
      properties:
        uuid:
          type: string
        name:
          $ref: "#/components/schemas/Translation"
        from:
          $ref: "#/components/schemas/ZeroTime"
        until:
          $ref: "#/components/schemas/ZeroTime"
        visibility:
          $ref: "#/components/schemas/Visibility"
        species:
          type: array
          nullable: true
          description: The target species.
          items:
            $ref: "#/components/schemas/Species"
        color:
          type: string
        template:
          type: string
          description: Uuid of the template it was made from. Only in `GET /v1/lists/list`.
    ListsResult:
      type: object
      properties:
        result:
          type: array
          items:
            $ref: "#/components/schemas/List"
    ListResult:
      type: object
      properties:
        result:
          $ref: "#/components/schemas/List"
    ListTemplate:
      type: object
      properties:
        uuid:
          type: string
        name:
          $ref: "#/components/schemas/Translation"
        description:
          $ref: "#/components/schemas/Translation"
        visibility:
          $ref: "#/components/schemas/Visibility"
        species:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/Species"
    ListTemplatesResult:
      type: object
      properties:
        result:
          type: array
          items:
            $ref: "#/components/schemas/ListTemplate"
    Report:
      type: object
      description: A sighting. Which relations are filled in depends on the route; the rest are `null` or empty.
      properties:
        uuid:
          type: string
        species:
          $ref: "#/components/schemas/Species"
        from:
          $ref: "#/components/schemas/ZeroTime"
        until:
          $ref: "#/components/schemas/ZeroTime"
        latitude:
          type: number
          description: 0 when unset.
        longitude:
          type: number
          description: 0 when unset.
        zone:
          allOf:
            - $ref: "#/components/schemas/Zone"
          nullable: true
          description: |
            The most specific zone around the position, worked out by the server. Right after reporting it may be a
            larger one (a county) and become the municipality once the server has looked the place up. `polygon` is
            `null` here.
        quantity:
          type: integer
          description: 0 when unset.
        age:
          allOf:
            - $ref: "#/components/schemas/NamedRecord"
          nullable: true
        activity:
          allOf:
            - $ref: "#/components/schemas/NamedRecord"
          nullable: true
        gender:
          allOf:
            - $ref: "#/components/schemas/NamedRecord"
          nullable: true
        method:
          allOf:
            - $ref: "#/components/schemas/NamedRecord"
          nullable: true
        comment:
          allOf:
            - $ref: "#/components/schemas/Comment"
          nullable: true
        site:
          type: string
        lists:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/List"
        tags:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/Tag"
        notification:
          allOf:
            - $ref: "#/components/schemas/Notification"
          nullable: true
    ReportsResult:
      type: object
      properties:
        result:
          type: array
          items:
            $ref: "#/components/schemas/Report"
    ReportFields:
      type: object
      required: [species_uuid]
      properties:
        species_uuid:
          type: string
        from:
          type: string
          description: RFC 3339, or `"YYYY-MM-DD"` for a date-only sighting (stored as midnight UTC).
          example: "2026-05-03T07:12:00Z"
        until:
          type: string
          description: Like `from`.
        latitude:
          type: number
        longitude:
          type: number
        quantity:
          type: integer
        age_uuid:
          type: string
        activity_uuid:
          type: string
        gender_uuid:
          type: string
        method_uuid:
          type: string
        comment:
          type: string
          description: A private note.
        site:
          type: string
          description: Free-text place name.
        list_uuids:
          type: array
          description: Your lists; unknown or other users' lists are ignored.
          items:
            type: string
        tag_uuids:
          type: array
          description: Your non-archived tags; others are ignored.
          items:
            type: string
    ReportCreate:
      allOf:
        - type: object
          properties:
            uuid:
              type: string
              pattern: '^[abcdefghjkmnpqrstuvwxyz123456789]{16,32}$'
              description: Optional client-made id; makes the call safe to repeat.
            silent:
              type: boolean
              default: false
              description: When false, a notification with `notification_comment` is created.
            notification_comment:
              type: string
        - $ref: "#/components/schemas/ReportFields"
    Notification:
      type: object
      description: |
        A comment thread on a sighting, made when it is reported unless `silent`, starting with
        `notification_comment`. Only the sighting's owner can add to it (`POST /v1/notifications/{uuid}/comment`);
        the server does nothing else with it yet, and `processed` is never set.
      properties:
        uuid:
          type: string
        comment:
          $ref: "#/components/schemas/Comment"
        processed:
          $ref: "#/components/schemas/ZeroTime"
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
    SpeciesUuidBody:
      type: object
      required: [species_uuid]
      properties:
        species_uuid:
          type: string
    ListUuidBody:
      type: object
      required: [list_uuid]
      properties:
        list_uuid:
          type: string
    TagUuidBody:
      type: object
      required: [tag_uuid]
      properties:
        tag_uuid:
          type: string
    User:
      type: object
      description: The email address is never included.
      properties:
        uuid:
          type: string
        display_name:
          type: string
        username:
          type: string
        notifications:
          type: integer
          description: Bit mask of notification settings, 8 for new accounts. Nothing reads or changes it yet.
        last_seen_at:
          $ref: "#/components/schemas/ZeroTime"
        confirmed_at:
          $ref: "#/components/schemas/ZeroTime"
        deactivated_at:
          $ref: "#/components/schemas/ZeroTime"
        deleted_at:
          $ref: "#/components/schemas/ZeroTime"
        accepted_terms_at:
          $ref: "#/components/schemas/ZeroTime"
        language:
          $ref: "#/components/schemas/Language"
        portrait:
          type: string
          example: "3.webp"
        scopes:
          type: string
          description: Space separated.
          example: user
    ApiKey:
      type: object
      properties:
        name:
          type: string
        prefix:
          type: string
        client_id:
          type: string
        scopes:
          type: string
          description: Space separated.
          example: user
        soft_limit:
          type: integer
        hard_limit:
          type: integer
          description: Calls a day.
        revoked_at:
          $ref: "#/components/schemas/ZeroTime"
        website:
          type: boolean
          description: The key the website signs in with; cannot be revoked.
    AuthRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type:
          type: string
          enum: [password, refresh_token]
        client_id:
          type: string
          description: Needed for `password`.
        client_secret:
          type: string
          description: "`<prefix>.<secret>`. Needed for `password`."
        email:
          type: string
          format: email
        password:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum: [user, admin]
          default: ["user"]
        stay_signed_in:
          type: boolean
          description: Kept across refreshes.
        refresh_token:
          type: string
          description: Needed for `refresh_token`.
    AuthTokens:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
          description: Single use.
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Seconds until the access token expires.
        scope:
          type: string
          description: Granted scopes, space separated.
          example: user
        lang:
          type: string
          description: The account's language code.
          example: sv
    NewsPost:
      type: object
      properties:
        uuid:
          type: string
        title:
          $ref: "#/components/schemas/LocalizedText"
        body:
          $ref: "#/components/schemas/LocalizedText"
        icon:
          type: string
          example: campaign
        color:
          type: string
          example: "#1273a3"
        published_at:
          type: string
          format: date-time
        read:
          type: boolean
    Announcement:
      type: object
      properties:
        uuid:
          type: string
        title:
          $ref: "#/components/schemas/LocalizedText"
        body:
          allOf:
            - $ref: "#/components/schemas/LocalizedText"
          description: |
            A small part of Markdown: `# heading`, `- item` lines, `**bold**`, `*italic*`, `[text](https://…)`, and a
            blank line between paragraphs. Older posts are HTML (`p`, `br`, `b`/`strong`, `i`/`em`, `a`, `ul`/`ol`/`li`,
            `h2`–`h4`). Render either without running scripts or keeping other attributes than a link's address.
        from:
          $ref: "#/components/schemas/ZeroTime"
        until:
          $ref: "#/components/schemas/ZeroTime"
        on_hold:
          allOf:
            - $ref: "#/components/schemas/ZeroTime"
          description: Set when the post is a draft or paused.
        icon:
          type: string
        color:
          type: string
    PublicUser:
      type: object
      properties:
        display_name:
          type: string
        username:
          type: string
        portrait:
          type: string
    CompetitionInfo:
      type: object
      properties:
        uuid:
          type: string
          description: 24 hex characters.
        name:
          $ref: "#/components/schemas/Translation"
        description:
          $ref: "#/components/schemas/Translation"
        color:
          type: string
        from:
          type: string
          format: date-time
        until:
          type: string
          format: date-time
          description: Exclusive.
        join_until:
          type: string
          format: date-time
        end_on_reports:
          type: integer
          description: 0 for no limit.
        max_competitors:
          type: integer
          description: 0 for no limit.
        visibility:
          type: integer
          enum: [0, 2]
        has_password:
          type: boolean
        list_name:
          allOf:
            - $ref: "#/components/schemas/Translation"
          nullable: true
          description: "`null` when all species count."
        list_size:
          type: integer
        zones:
          type: array
          description: |
            The counties' names; empty means anywhere. These are names, not zones: `uuid` is the name's, not the
            county's.
          items:
            $ref: "#/components/schemas/Translation"
        creator:
          $ref: "#/components/schemas/PublicUser"
        participants:
          type: integer
        status:
          type: string
          enum: [upcoming, ongoing, finished]
        ended_at:
          type: string
          format: date-time
          nullable: true
        joined:
          type: boolean
        is_creator:
          type: boolean
        invited:
          type: boolean
        can_join:
          type: boolean
        my_rank:
          type: integer
          description: 0 when not taking part.
        my_count:
          type: integer
        standings:
          type: array
          nullable: true
          description: "`null` in lists, or when you may not see them."
          items:
            $ref: "#/components/schemas/Standing"
    Standing:
