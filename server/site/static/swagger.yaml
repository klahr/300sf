openapi: 3.0.3
info:
  title: "300sf API"
  version: "1"
  contact:
    name: "300sf"
    url: "https://github.com/klahr/300sf"
  license:
    name: "AGPL-3.0-or-later"
    url: "https://www.gnu.org/licenses/agpl-3.0.html"
  description: |
    Checklists, sightings, competitions and species for 300 Svenska Fåglar.

    All API routes live under `/v1`. Request bodies are JSON (`Content-Type: application/json`) unless a route says
    otherwise, and are limited to 1 MiB (10 MiB for `POST /v1/analyze`). Unknown fields are ignored.

    ## Getting an API key

    Every client signs in with an API key that belongs to a user account. Create one in the app under
    **Settings → API keys**, with `POST /v1/api_keys` while signed in, or, without signing in, with the
    account's email and password on `POST /v1/api_keys/password` (so a client can let a brand-new account
    get its first key). You get two values:

    - the **secret**, `"<prefix>.<secret>"` (for example `abc1234.Zm9vYmFy…`). It is shown **only once**; store it.
    - the **client_id**, which is also listed by `GET /v1/api_keys/list`.

    Signing in needs **both**: `client_id` plus the secret as `client_secret`, together with the account's email and
    password.

    A key identifies the **client**, not who signs in: any account's email and password work with it (the website
    signs everyone in with one key). The key's scopes cap every session made through it, its daily call limit
    counts the calls of all of them, and revoking it ends all of them. Don't share a key you don't want others
    to sign in through.

    ## Signing in

    ```
    POST /v1/auth
    {"grant_type": "password", "client_id": "…", "client_secret": "abc1234.…",
     "email": "you@example.com", "password": "…", "scopes": ["user"]}
    ```

    The answer holds an `access_token` (a JWT) and a `refresh_token`. Send the access token on every call as
    `Authorization: Bearer <access_token>`. Click **Authorize** above to try routes from this page.

    ### Scopes

    | Scope | Gives access to |
    |---|---|
    | `user` | Every normal route. |
    | `admin` | Routes marked **Admin only**. Only granted to admin accounts. |

    `scopes` is optional and defaults to `["user"]`. The token gets the requested scopes that both the user and the
    API key have (the granted ones are in the response's `scope`, space separated). Scopes are matched exactly: an
    admin who wants to call both normal and admin routes asks for `["user", "admin"]`. A missing scope is answered
    with **401** and code `3005` (not 403).

    ### Refreshing tokens

    Access tokens are short lived (`expires_in` seconds). Before or after one expires, get a new pair with
    `{"grant_type": "refresh_token", "refresh_token": "…"}` on `POST /v1/auth`. **Refresh tokens are single use**:
    each refresh returns a new refresh token and the old one stops working, so always keep the latest one. Reusing a
    spent or revoked refresh token gives 401 code `7001`. Scopes can only shrink on refresh. `POST /v1/auth/logout`
    revokes a refresh token. Changing the password revokes every session of the account.

    ### Rate limit

    Each API key has a daily call limit (its `hard_limit`, see `GET /v1/api_keys/list`). The counter starts with the
    first call and resets when its window (a day) runs out. Calls above the limit are answered with
    **429** `{"message": "too many calls on api key", "code": 3004}`. Some routes have their own throttles
    (sign-up, password reset, contact, analyze, zone search, …), answered with 429 code `7003`.

    ## Conventions

    - **Envelopes differ per route.** Some return the object itself (bare), some `{"result": …}`, some
      `{"message": "success", "data": …}`, the news feed `{"data": […], "more": bool}`, and many mutations return
      **204 with no body** (do not parse it). Each route below says which.
    - **Unset values are never `null`** on model fields: an unset time is `"0001-01-01T00:00:00Z"`, an unset string
      `""` and an unset number `0` (a latitude/longitude of 0 means "no position"). Relations (`zone`, `age`,
      `comment`, …) and lists of relations can be `null` when unset or not loaded by that route; treat a `null` list
      as empty. On input, `""`, `0` and `null` usually mean "not given".
    - Times are RFC 3339, written in the server's time zone (e.g. `"2026-02-01T01:00:00+01:00"`), not
      necessarily UTC; send them in any offset. A sighting time at exactly 00:00:00 UTC means "date only": compare
      the instant, not the text (`"2026-02-01T01:00:00+01:00"` is a date-only time).
    - Ids (`uuid`) are short strings (10 characters for new records; competitions use 24 hex characters).
    - **Not found is usually 400**, not 404 (competitions and some announcement routes use 404).
    - Errors are JSON `{"message": "…", "code": 1234}`. `code` is missing on some errors; `message` may be a raw
      database or parse error.
    - Text longer than its column is 400 code 2001 `"<column> is too long"`, and a duplicate is 400 code 1002.
      Names (each language of a `Translation`) hold 128 characters, tag names 64, a sighting's `site` 256 and
      its `comment` 65,535 bytes.
    - The optional header `X-App-Language` (`en`, `sv`, `de`) picks the language of a new account and of Wikipedia
      texts.

    ## Error codes

    | Code | Meaning |
    |---|---|
    | 1000 | Internal server error |
    | 1001 | Record not found |
    | 1002 | Could not insert |
    | 1003 | Could not delete |
    | 1004 | Missing header |
    | 1005 | Invalid request |
    | 2001 | Could not parse the request (or a field in it) |
    | 2002 | Link expired |
    | 2003 | Missing file |
    | 2004 | Unknown error |
    | 3001 | Logged out |
    | 3002 | Missing API key (`client_id`) |
    | 3003 | Invalid or revoked API key |
    | 3004 | Too many calls on the API key (429) |
    | 3005 | Missing scope |
    | 3006 | Too many API keys (max 10 active) |
    | 4001 | Invalid display name |
    | 4002 | Invalid or taken email |
    | 4003 | Invalid password |
    | 4004 | Terms not accepted (also "invalid language") |
    | 4005 | Invalid username |
    | 4006 | Username taken (409) |
    | 6001 | Account deactivated |
    | 7001 | Not signed in, or invalid credentials or token |
    | 7002 | Too many wrong passwords, try again later (429) |
    | 7003 | Too many requests, try again later (429) |
    | 8001 | Bird sound identification unavailable |
    | 9001 | Wrong competition password (403) |
    | -10001 | Generic bad request (parse or database error) |
    | -30002 | Wrong password |
servers:
  - url: /
    description: "This server"
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Signing in and out.
  - name: Users
    description: Accounts and the signed-in user.
  - name: API keys
  - name: Lists
    description: Checklists.
  - name: List templates
    description: Species lists that checklists are made from.
  - name: Reports
    description: Sightings.
  - name: Tags
    description: The user's labels for sightings.
  - name: Species
  - name: Catalog
    description: Orders, ages, genders, methods and activities.
  - name: Zones
    description: Countries, counties, municipalities and habitats.
  - name: Competitions
  - name: Announcements
    description: News posts.
  - name: Notifications
  - name: Contact
  - name: Analyze
    description: Bird sound identification.
  - name: Admin
    description: Invites, emails and translations. All admin only.
  - name: Health

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: healthy
                  data:
                    type: object
                    properties:
                      version:
                        type: string

  /v1/config:
    get:
      tags: [Health]
      summary: What this server offers
      description: |
        No token needed. Bare object. The map tiles and attribution the server's owner chose (OpenStreetMap's by
        default), the link to its source code (the AGPL asks clients to offer it), and which optional features are
        turned on. A turned-off feature answers 503: `analyze` is `POST /v1/analyze`, `contact` is
        `POST /v1/contact`, and `region_search` is `GET /v1/zones/search` and `POST /v1/zones/osm`.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                  source_url:
                    type: string
                    example: "https://github.com/klahr/300sf"
                  map:
                    type: object
                    properties:
                      tiles:
                        type: string
                        description: A Leaflet-style tile URL template.
                        example: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
                      attribution:
                        type: string
                        description: HTML to show on the map.
                  features:
                    type: object
                    properties:
                      analyze:
                        type: boolean
                      contact:
                        type: boolean
                      region_search:
                        type: boolean

  # ---------------------------------------------------------------- Auth
  /v1/auth:
    post:
      tags: [Auth]
      summary: Sign in or refresh tokens
      description: |
        No token needed.

        - `grant_type: "password"` needs `client_id`, `client_secret` (`"<prefix>.<secret>"`), `email` and `password`.
        - `grant_type: "refresh_token"` needs `refresh_token`. `client_id` is optional but must match the key the
          token was issued for. The refresh token is used up; keep the new one from the response.

        `scopes` is optional and defaults to `["user"]`. The token gets the requested scopes that both the user and
        the API key have; if that leaves none, sign-in fails with 400 code 3005 (and a refresh whose scopes the user
        or key has lost fails with 401 code 7001).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthRequest"
            examples:
              password:
                value:
                  grant_type: password
                  client_id: "a1b2c3d4-…"
                  client_secret: "abc1234.secret"
                  email: "you@example.com"
                  password: "hunter22"
                  scopes: ["user"]
              refresh:
                value:
                  grant_type: refresh_token
                  refresh_token: "eyJhbGciOi…"
      responses:
        "200":
          description: Tokens (bare).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "400":
          description: |
            Parse error (2001), unknown `grant_type` (1005), wrong email or password (7001), deactivated
            account (6001), or none of the requested scopes allowed (3005).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: |
            Missing `client_id` (3002); invalid `client_secret`, unknown or revoked API key (3003); invalid, spent or
            revoked refresh token, or `client_id` not matching it (7001).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many wrong passwords for this account or network (7002).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The session could not be stored (2004).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke a refresh token
      description: No token needed. Ends the session the refresh token belongs to. Unknown or invalid tokens are ignored.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"

  # ---------------------------------------------------------------- Users
  /v1/users:
    post:
      tags: [Users]
      summary: Sign up
      description: |
        No token needed. Creates an account; sign in with `POST /v1/auth` afterwards (no tokens are returned).
        `X-App-Language` sets the account language and the welcome email (`en`, `sv`, `de`; anything else is `en`).
        Throttled to 10 sign-ups an hour per client IP (429 code 7003).
      security: []
      parameters:
        - $ref: "#/components/parameters/XAppLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, display_name, username, password, accepted_terms]
              properties:
                email:
                  type: string
                  format: email
                display_name:
                  type: string
                  minLength: 4
                  maxLength: 64
                  description: 4–64 characters, no `<` or `>`.
                username:
                  type: string
                  pattern: '^\w(?:[\w.#-]*\w){3,31}$'
                  description: At least 4 characters; starts and ends with a letter, digit or `_`; `.`, `#`, `-` allowed inside.
                password:
                  type: string
                  minLength: 8
                  maxLength: 1024
                accepted_terms:
                  type: boolean
                  description: Must be `true`.
                portrait:
                  type: string
                  pattern: '^[0-9]{1,3}\.(webp|png)$'
                  example: "3.webp"
                  description: Optional built-in avatar, `1.webp` … `10.webp`.
      responses:
        "200":
          description: The new user (bare). `language` is not filled in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: |
            Parse error (-10001), invalid portrait (2001), display name (4001), username (4005), invalid or already
            registered email (4002), password (4003) or terms not accepted (4004).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Username taken (4006).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: username taken
                code: 4006
        "429":
          $ref: "#/components/responses/Throttled"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/users/me:
    get:
      tags: [Users]
      summary: Dashboard data for the signed-in user
      description: |
        Bare object. `last_reports`: non-archived sightings created in the last 14 days, newest first, max 50
        (`species.order` and `activity` are not filled in). `list_reports`: one entry per active list with its
        non-archived sightings (`comment` and `activity` not filled in); `null` when the user has no lists. Each
        `list` has its target `species` with `name` and `order`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  last_reports:
                    type: array
                    items:
                      $ref: "#/components/schemas/Report"
                  list_reports:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        list:
                          $ref: "#/components/schemas/List"
                        reports:
                          type: array
                          items:
                            $ref: "#/components/schemas/Report"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/users/whoami:
    get:
      tags: [Users]
      summary: The signed-in user
      responses:
        "200":
          description: "`{message, data}` with the user, language filled in."
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: success
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/users/list:
    get:
      tags: [Users]
      summary: All users
      description: "**Admin only** (needs the `admin` scope). Bare array of every non-deleted user, unpaginated; `language` not filled in."
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/users/{uuid}:
    get:
      tags: [Users]
      summary: One user and their sightings
      description: |
        **Admin only** (needs the `admin` scope). Bare `{user, reports}`. The reports have no relations filled in
        (only uuid, times, position, quantity and site are meaningful).
      parameters:
        - $ref: "#/components/parameters/Uuid"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  reports:
                    type: array
                    items:
                      $ref: "#/components/schemas/Report"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/users/export:
    get:
      tags: [Users]
      summary: Export all account data as JSON
      description: |
        Bare JSON document with the account, every checklist, label and sighting (archived ones too). Unlike the rest
        of the API, missing values here are real `null`s, and times are ISO 8601: a bare date when the stored time is
        midnight UTC, else RFC 3339 in UTC. Names are `{sv?, en?, de?, la?}` with empty languages left out.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountExport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/users/language:
    post:
      tags: [Users]
      summary: Set the account language
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language_code]
              properties:
                language_code:
                  type: string
                  enum: [en, sv, de]
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          description: Parse error (2001) or unknown language (1001).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/users/portrait:
    post:
      tags: [Users]
      summary: Pick a portrait
      description: JSON, not an upload. Names a built-in avatar served at `/img/portraits/<name>`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [portrait]
              properties:
                portrait:
                  type: string
                  pattern: '^[0-9]{1,3}\.(webp|png)$'
                  example: "3.webp"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          description: Parse error or invalid portrait (2001).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/users/display_name:
    post:
      tags: [Users]
      summary: Change the display name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name]
              properties:
                display_name:
                  type: string
                  minLength: 4
                  maxLength: 64
                  description: 4–64 characters, no `<` or `>`.
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          description: Parse error (2001) or invalid display name (4001).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/users/username:
    post:
      tags: [Users]
      summary: Change the username
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                  pattern: '^\w(?:[\w.#-]*\w){3,31}$'
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          description: Parse error (2001) or invalid username (4005).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Username taken (4006).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: username taken
                code: 4006
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/users/email:
    post:
      tags: [Users]
      summary: Change the email address
      description: Needs the current password. A notice is sent to the old address.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  description: The current password.
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          description: Parse error (2001), invalid or taken email (4002) or wrong password (-30002).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Too many wrong passwords (7002), or too many calls on the API key (3004).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/users/reset_password:
    post:
      tags: [Users]
      summary: Send a password reset email
      description: |
        No token needed. Always 204 for a parseable body, whether or not the account exists. The email links to
        the website's `/set-password?token=<token>`, valid 24 hours; other clients can let the user paste the link
        or token and call `POST /v1/users/set_password/{token}`; a new one is not sent within 2 minutes of the last. Throttled
        to 10 an hour per client IP (429 code 7003).
      security: []
      parameters:
        - $ref: "#/components/parameters/XAppLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/Throttled"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/users/set_password/{token}:
    post:
      tags: [Users]
      summary: Set a new password with a reset link
      description: |
        No token needed. `token` is the `token` value from the reset email (URL-encode it). Uses up every reset
        link of the user and signs the user out everywhere.
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
                  minLength: 8
                  maxLength: 1024
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          description: Parse error (2001), unknown or used link (1001), expired link (2002) or invalid password (4003).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/users/request_delete:
    post:
      tags: [Users]
      summary: Ask to delete the account
      description: |
        Emails a confirmation link to the website's `/delete-account?token=<token>`, valid 1 hour; other clients can
        let the user paste the link or token and call `DELETE /v1/users/confirm_delete/{token}`. Throttled to 3 an
        hour per user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          description: Parse error (2001), wrong password (-30002) or no account language (4004).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Too many wrong passwords (7002), too many requests (7003) or too many calls on the API key (3004).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/users/confirm_delete/{token}:
    delete:
      tags: [Users]
      summary: Confirm deleting the account
      description: |
        Must be signed in as the account that asked. Takes a JSON body. Deactivates the account at once, schedules
        deletion in 7 days and signs out everywhere.
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password:
                  type: string
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          description: Parse error (2001), wrong password (-30002), unknown or used link (1001) or expired link (2002).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Too many wrong passwords (7002) or too many calls on the API key (3004).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # ---------------------------------------------------------------- API keys
  /v1/api_keys/list:
    get:
      tags: [API keys]
      summary: The user's API keys
      description: All keys, revoked ones too (`revoked_at` set). Keys have no uuid; they are identified by `prefix`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiKey"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/api_keys:
    post:
      tags: [API keys]
      summary: Create an API key
      description: |
        At most 10 active keys per user. `scopes` defaults to `["user"]`; each must be a scope the user has. The
        secret in `api_key` is shown only once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "My script"
                scopes:
                  type: array
                  items:
                    type: string
                    enum: [user, admin]
                  default: ["user"]
      responses:
        "200":
          description: The new key.
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key:
                    type: string
                    description: "`<prefix>.<secret>`, the `client_secret` for signing in. Shown only once."
                    example: "abc1234.Zm9vYmFyYmF6"
                  client_id:
                    type: string
                  prefix:
                    type: string
                    example: abc1234
                  scopes:
                    type: string
                    description: Space separated.
                    example: "user admin"
        "400":
          description: Parse error (-10001), a scope the user does not have (3005) or too many keys (3006).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/api_keys/password:
    post:
      tags: [API keys]
      summary: Create an API key with email and password
      description: |
        No token needed, so a client can give a new account its first key (signing in needs one). The key gets the
        `user` scope only; make admin keys with `POST /v1/api_keys`. At most 10 active keys per user. Wrong
        passwords count towards the same limits as signing in (429 code 7002), and the route is throttled to 10
        calls an hour per client IP (429 code 7003). The secret in `api_key` is shown only once.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                name:
                  type: string
                  example: "My client"
      responses:
        "200":
          description: The new key (bare), as from `POST /v1/api_keys`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  api_key:
                    type: string
                    description: "`<prefix>.<secret>`, the `client_secret` for signing in. Shown only once."
                    example: "abc1234.Zm9vYmFyYmF6"
                  client_id:
                    type: string
                  prefix:
                    type: string
                    example: abc1234
                  scopes:
                    type: string
                    example: user
        "400":
          description: |
            Parse error (2001), wrong email or password (7001), deactivated account (6001) or too many keys (3006).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many wrong passwords (7002) or too many calls from this client (7003).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/api_keys/{prefix}/revoke:
    post:
      tags: [API keys]
      summary: Revoke an API key
      description: No body needed. The key the website signs in with cannot be revoked.
      parameters:
        - name: prefix
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          description: Unknown key, not yours, or the website's key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"

  # ---------------------------------------------------------------- Lists
  /v1/lists/list:
    get:
      tags: [Lists]
      summary: The user's active checklists
      description: Species have `name` and `order` filled in. `template` is set when the list was made from a template (only here).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListsResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/lists/archived:
    get:
      tags: [Lists]
      summary: The user's archived checklists
      description: Newest archived first. Species carry only `uuid`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListsResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/lists:
    post:
      tags: [Lists]
      summary: Create a checklist
      description: |
        With `template`, the template's species are copied to the list; without it the list has no species.
        `from` and `until` take `"YYYY-MM-DD"` or RFC 3339; anything else is 400 code 2001.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: "#/components/schemas/Translation"
                visibility:
                  $ref: "#/components/schemas/Visibility"
                template:
                  type: string
                  description: Uuid of the user's own or a public list template.
                from:
                  type: string
                  example: "2026-01-01"
                until:
                  type: string
                  example: "2026-12-31"
                color:
                  type: string
                  example: "#1273a3"
      responses:
        "200":
          description: The new list (bare). Species carry only `uuid`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/List"
        "400":
          description: |
            Parse error (-10001), invalid `from`/`until` (2001), `visibility` not 0, 1 or 2 (1005), or `template`
            unknown or another user's private one (1001).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          description: A database error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/lists/{uuid}:
    get:
      tags: [Lists]
      summary: One checklist
      description: |
        Your own list, or another user's non-private list (10-character ids only). Archived lists are not found.
        Species have `name` and `order` filled in.
      parameters:
        - $ref: "#/components/parameters/Uuid"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags: [Lists]
      summary: Delete an archived checklist
      description: Only archived lists can be deleted. The sightings are kept; only their links to the list go.
      parameters:
        - $ref: "#/components/parameters/Uuid"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          description: Not found, not yours or not archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/lists/{uuid}/archive:
    post:
      tags: [Lists]
      summary: Archive a checklist
      description: No body. 204 even when nothing matched.
      parameters:
        - $ref: "#/components/parameters/Uuid"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/lists/{uuid}/restore:
    post:
      tags: [Lists]
      summary: Restore an archived checklist
      description: No body. 204 even when nothing matched.
      parameters:
        - $ref: "#/components/parameters/Uuid"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/lists/{uuid}/rename:
    post:
      tags: [Lists]
      summary: Rename a checklist
      description: Only languages with a non-empty value are written; a language cannot be cleared.
      parameters:
        - $ref: "#/components/parameters/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: "#/components/schemas/Translation"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/lists/{uuid}/color:
    post:
      tags: [Lists]
      summary: Set a checklist's color
      parameters:
        - $ref: "#/components/parameters/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                color:
                  type: string
                  maxLength: 16
                  description: '`""` resets the color.'
                  example: "#157975"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          description: Invalid color (over 16 characters), or list not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/lists/{uuid}/timespan:
    post:
      tags: [Lists]
      summary: Set a checklist's timespan
      description: |
        Each of `from` and `until` takes `"YYYY-MM-DD"` or RFC 3339. `"*"` clears the date; `""` or leaving the
        field out keeps it. Anything else is 400 code 2001. The timespan is informational only.
      parameters:
        - $ref: "#/components/parameters/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                  example: "2026-01-01"
                until:
                  type: string
                  example: "*"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          description: Invalid date (2001), or list not found or not yours.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/lists/{uuid}/visibility:
    post:
      tags: [Lists]
      summary: Set a checklist's visibility
      parameters:
        - $ref: "#/components/parameters/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visibility]
              properties:
                visibility:
                  $ref: "#/components/schemas/Visibility"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          description: Missing or invalid visibility (1005), or list not found or not yours.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/lists/{uuid}/reports:
    get:
      tags: [Lists]
      summary: Sightings on a checklist
      description: |
        Non-archived sightings linked to one of your lists (archived lists allowed). `species.name`, `zone`, `age`,
        `gender`, `method` and `tags` are filled in; `activity`, `comment` and `lists` are `null`.
      parameters:
        - $ref: "#/components/parameters/Uuid"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportsResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/lists/species/{species_uuid}:
    get:
      tags: [Lists]
      summary: The user's checklists, and whether a species is on each
      description: "`result` is `null` when the user has no lists. Each `list` has `name`; `species` is `null`."
      parameters:
        - name: species_uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        list:
                          $ref: "#/components/schemas/List"
                        available:
                          type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/lists/compare:
    post:
      tags: [Lists]
      summary: Compare shared checklists
      description: |
        No token needed. 1–20 list uuids; the first is the reference. Only non-private, non-archived lists with
        10-character ids are used; others are dropped silently. `result` has one entry per found list, in the order
        asked for (the reference first) and naming its `list`, each with one report per distinct species seen. Throttled to 60 a minute per
        client IP (429 code 7003).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uuids]
              properties:
                uuids:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: string
      responses:
        "200":
          description: Bare comparison.
          content:
            application/json:
              schema:
                type: object
                properties:
                  species:
                    type: array
                    description: The reference list's target species.
                    items:
                      $ref: "#/components/schemas/Species"
                  result:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        list:
                          type: object
                          properties:
                            uuid:
                              type: string
                            name:
                              $ref: "#/components/schemas/Translation"
                        user:
                          type: object
                          properties:
                            display_name:
                              type: string
                        reports:
                          type: array
                          items:
                            type: object
                            properties:
                              species:
                                type: object
                                properties:
                                  uuid:
                                    type: string
                  reference_list:
                    $ref: "#/components/schemas/List"
        "400":
          description: Wrong number of uuids, or the reference list not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/Throttled"

  # ---------------------------------------------------------------- List templates
  /v1/list_templates/list:
    get:
      tags: [List templates]
      summary: Your and public list templates
      description: Non-archived. Species carry only `uuid`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTemplatesResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/list_templates/list/me:
    get:
      tags: [List templates]
      summary: Your own list templates
      description: Non-archived. Species carry only `uuid`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTemplatesResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/list_templates:
    post:
      tags: [List templates]
      summary: Create a list template
      description: |
        A template is private (0) or public (2). Public needs the `admin` scope; otherwise, and for 1, it is stored
        as 0. Other values are 400 code 1005. A private template is yours alone: to give someone your species,
        share a checklist made from it (they read its `species` and create their own template).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: "#/components/schemas/Translation"
                description:
                  $ref: "#/components/schemas/Translation"
                visibility:
                  $ref: "#/components/schemas/Visibility"
                species_uuids:
                  type: array
                  description: Must all exist and have no duplicates.
                  items:
                    type: string
      responses:
        "200":
          description: The new template (bare). `species` is `null`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListTemplate"
        "400":
          description: Parse error (-10001) or unknown species.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/list_templates/{uuid}:
    get:
      tags: [List templates]
      summary: One list template
      description: Your own or a public template (archived ones too). Species have `name` and `order` filled in.
      parameters:
        - $ref: "#/components/parameters/Uuid"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: "#/components/schemas/ListTemplate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/list_templates/{uuid}/archive:
    post:
      tags: [List templates]
      summary: Archive a list template
      description: No body. 204 even when nothing matched. Lists made from it keep working.
      parameters:
        - $ref: "#/components/parameters/Uuid"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/list_templates/{uuid}/add_species:
    post:
      tags: [List templates]
      summary: Add a species to a template
      description: Your own template. Does not change lists made from it (use `/species` for that).
      parameters:
        - $ref: "#/components/parameters/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeciesUuidBody"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          description: Template or species not found, or already added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/list_templates/{uuid}/remove_species:
    post:
      tags: [List templates]
      summary: Remove a species from a template
      description: Your own template. Does not change lists made from it.
      parameters:
        - $ref: "#/components/parameters/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeciesUuidBody"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          description: Template or species not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/list_templates/{uuid}/name:
    post:
      tags: [List templates]
      summary: Rename a template
      description: Only languages with a non-empty value are written.
      parameters:
        - $ref: "#/components/parameters/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  $ref: "#/components/schemas/Translation"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/list_templates/{uuid}/description:
    post:
      tags: [List templates]
      summary: Change a template's description
      description: Only languages with a non-empty value are written.
      parameters:
        - $ref: "#/components/parameters/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  $ref: "#/components/schemas/Translation"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/list_templates/{uuid}/species:
    post:
      tags: [List templates]
      summary: Replace a template's species
      description: |
        Your own non-archived template. Also replaces the species of **every** list (any user's) made from it.
        Sightings stay on the lists.
      parameters:
        - $ref: "#/components/parameters/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [species_uuids]
              properties:
                species_uuids:
                  type: array
                  minItems: 1
                  description: Must all exist and have no duplicates.
                  items:
                    type: string
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          description: Parse error (2001), template not found (1001), or no, unknown or duplicate species (1005).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/list_templates/{uuid}/visibility:
    post:
      tags: [List templates]
      summary: Make a template public or private
      description: "**Admin only** (needs the `admin` scope). Only the admin's own non-archived template."
      parameters:
        - $ref: "#/components/parameters/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visibility]
              properties:
                visibility:
                  type: integer
                  enum: [0, 2]
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          description: Invalid visibility or template not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ---------------------------------------------------------------- Reports
  /v1/reports/list:
    get:
      tags: [Reports]
      summary: All of the user's sightings
      description: |
        Non-archived, newest created first, unpaginated. Everything is filled in except `species.order` and
        `notification`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportsResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags: [Reports]
      summary: Sightings on one of your checklists (minimal)
      description: Non-archived. Only `species.name` and `zone` are filled in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [list_uuid]
              properties:
                list_uuid:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportsResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/reports:
    post:
      tags: [Reports]
      summary: Create a sighting
      description: |
        `zone` is worked out by the server from the position, possibly later in the background. A client-made
        `uuid` makes the call idempotent: sending the same one again returns the stored sighting.

        400 code -10001 for an unknown species, a negative `quantity`, a position outside ±90/±180, or `until`
        before `from`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportCreate"
      responses:
        "200":
          description: |
            The sighting (bare), with `species`, `zone`, `age`, `gender`, `method`, `activity`, `comment`, `lists` and
            `tags` filled in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          description: Parse error, invalid `uuid`, unknown species or record (-10001).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: The `uuid` belongs to another user's sighting (-10001).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/reports/{uuid}:
    get:
      tags: [Reports]
      summary: One sighting
      description: Your own sighting, archived ones too. Everything is filled in except `species.order`.
      parameters:
        - $ref: "#/components/parameters/Uuid"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: "#/components/schemas/Report"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    put:
      tags: [Reports]
      summary: Edit a sighting
      description: |
        Replaces every field: fields left out are cleared, and `list_uuids` / `tag_uuids` replace the sighting's
        lists and tags. To change only its checklists or labels, use `add_list`/`remove_list` and
        `add_tag`/`remove_tag` instead. Archived sightings cannot be edited.
      parameters:
        - $ref: "#/components/parameters/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportFields"
      responses:
        "200":
          description: |
            The sighting (bare), with `species`, `zone`, `age`, `gender`, `method`, `activity`, `comment`, `lists` and
            `tags` filled in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
        "400":
          description: Parse error, unknown species or record, sighting not found, not yours or archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags: [Reports]
      summary: Delete a sighting
      description: Permanent; also deletes its comment.
      parameters:
        - $ref: "#/components/parameters/Uuid"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/reports/{uuid}/archive:
    post:
      tags: [Reports]
      summary: Archive a sighting
      description: No body. Hides it from lists, exports and competitions; cannot be undone. 204 even when not found.
      parameters:
        - $ref: "#/components/parameters/Uuid"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/reports/{uuid}/add_tag:
    post:
      tags: [Reports]
      summary: Add a tag to a sighting
      parameters:
        - $ref: "#/components/parameters/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagUuidBody"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          description: |
            Parse error (2001), tag not found or archived (1001), the tag already on it (1002), or sighting not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/reports/{uuid}/remove_tag:
    post:
      tags: [Reports]
      summary: Remove a tag from a sighting
      description: 204 even when the tag was not on it.
      parameters:
        - $ref: "#/components/parameters/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagUuidBody"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          description: Sighting or tag not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/reports/{uuid}/add_list:
    post:
      tags: [Reports]
      summary: Put a sighting on a checklist
      description: Your own non-archived sighting and your own checklist (archived ones too). Nothing else changes.
      parameters:
        - $ref: "#/components/parameters/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListUuidBody"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          description: Parse error (2001), sighting or checklist not found or not yours (1001), or already on it (1002).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/reports/{uuid}/remove_list:
    post:
      tags: [Reports]
      summary: Take a sighting off a checklist
      description: 204 even when it was not on it. The sighting is kept.
      parameters:
        - $ref: "#/components/parameters/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListUuidBody"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          description: Parse error (2001), or sighting or checklist not found or not yours (1001).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/reports/basis:
    put:
      tags: [Reports]
      summary: Everything the sighting form needs
      description: |
        All ages, genders, methods and activities, the user's active lists (`species` is `null`) and tags, and the
        species. The four catalogs are empty on a new server until an admin adds entries (`POST /v1/ages` etc.); a
        client should then leave those fields out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeciesUuidBody"
      responses:
        "200":
          description: Bare object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  species:
                    $ref: "#/components/schemas/Species"
                  ages:
                    type: array
                    items:
                      $ref: "#/components/schemas/NamedRecord"
                  genders:
                    type: array
                    items:
                      $ref: "#/components/schemas/NamedRecord"
                  methods:
                    type: array
                    items:
                      $ref: "#/components/schemas/NamedRecord"
                  activities:
                    type: array
                    items:
                      $ref: "#/components/schemas/NamedRecord"
                  lists:
                    type: array
                    items:
                      $ref: "#/components/schemas/List"
                  tags:
                    type: array
                    items:
                      $ref: "#/components/schemas/Tag"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          description: Missing or unknown species.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/reports/export:
    put:
      tags: [Reports]
      summary: Export a checklist as CSV
      description: |
        One row per species: its earliest non-archived sighting on the list. UTF-8 with a BOM; the delimiter is `;`
        when the account language is `sv` or `de`, else `,`. Columns: `species, scientific_name, first_seen,
        seen_until, quantity, method, age, sex, activity, comment, site, municipality, latitude, longitude, labels`.
        Times are `YYYY-MM-DD` when stored at midnight UTC, else `YYYY-MM-DD HH:MM` in the requested time zone.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [list_uuid]
              properties:
                list_uuid:
                  type: string
                format:
                  type: string
                  description: Ignored; always CSV.
                  example: csv
                time_zone:
                  type: string
                  description: IANA time zone (preferred).
                  example: Europe/Stockholm
                timezone_offset:
                  type: integer
                  description: Minutes ahead of UTC; used when `time_zone` is missing or invalid.
                  example: 120
      responses:
        "200":
          description: |
            CSV file, with `Content-Disposition: attachment; filename="<list name>.csv"` (RFC 2231 encoded when not
            ASCII). The header is exposed to other origins.
          content:
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ---------------------------------------------------------------- Tags
  /v1/tags/list:
    get:
      tags: [Tags]
      summary: The user's tags
      description: Non-archived.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      $ref: "#/components/schemas/Tag"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/tags:
    post:
      tags: [Tags]
      summary: Create a tag
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Required; trimmed; at most 64 characters.
                color:
                  type: string
                  description: '`"#rrggbb"` or `""`.'
                  example: "#1273a3"
      responses:
        "200":
          description: The new tag (bare).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          description: Parse error (2001), empty name or invalid color (1005), or name too long (2001).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/tags/{uuid}:
    get:
      tags: [Tags]
      summary: One tag
      description: Your own tag, archived ones too.
      parameters:
        - $ref: "#/components/parameters/Uuid"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/tags/{uuid}/archive:
    post:
      tags: [Tags]
      summary: Archive a tag
      description: No body. 204 even when nothing matched.
      parameters:
        - $ref: "#/components/parameters/Uuid"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/tags/{uuid}/rename:
    post:
      tags: [Tags]
      summary: Rename a tag
      parameters:
        - $ref: "#/components/parameters/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Required; trimmed; at most 64 characters.
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          description: Parse error (2001), empty name (1005), or tag not found or archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ---------------------------------------------------------------- Species
  /v1/species/list:
    get:
      tags: [Species]
      summary: All species
      description: Every species with `name` and `order` filled in. Unpaginated, unordered.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: array
                    items:
                      $ref: "#/components/schemas/Species"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /v1/species:
    post:
      tags: [Species]
      summary: Create a species
      description: "**Admin only** (needs the `admin` scope)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, order_uuid]
              properties:
                name:
                  $ref: "#/components/schemas/Translation"
                order_uuid:
                  type: string
      responses:
        "200":
          description: The new species (bare). `order` is not filled in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Species"
        "400":
          description: Parse error (2001) or unknown order (1001).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/species/{uuid}:
    get:
      tags: [Species]
      summary: Species details with recordings and Wikipedia text
      description: |
        Needs a valid token with any scope. `X-App-Language` picks the Wikipedia edition (falls back to `en`).
        Up to 25 recordings from xeno-canto (`null` when none). Cached; can be slow on a cache miss.
      parameters:
        - $ref: "#/components/parameters/Uuid"
        - $ref: "#/components/parameters/XAppLanguage"
      responses:
        "200":
          description: Bare object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    $ref: "#/components/schemas/Species"
                  recordings:
                    type: array
                    nullable: true
                    items:
                      $ref: "#/components/schemas/Recording"
                  wikipedia:
                    $ref: "#/components/schemas/Wikipedia"
        "400":
          description: Species not found (1001).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/ServerError"
  /v1/species/{uuid}/set_rarity:
    post:
      tags: [Species]
      summary: Set a species' rarity in a zone
      description: "**Admin only** (needs the `admin` scope). `\"-\"` removes the rarity."
      parameters:
        - $ref: "#/components/parameters/Uuid"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, zone_uuid]
              properties:
                category:
                  type: string
                  enum: [a, b, c, d, e, "-"]
                zone_uuid:
                  type: string
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          description: Invalid category, or unknown species or zone (1001).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"

