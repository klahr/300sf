subject: Willkommen bei 300 Schwedische Vögel
email: hej@300sf.se
name: 300 Schwedische Vögel
preheader: Dein Konto ist bereit. So legst du los.
heading: Willkommen, ${DISPLAY_NAME}
body:
- Dein Konto ist bereit. Mit 300 Schwedische Vögel behältst du den Überblick über die Vögel, die du in Schweden beobachtest, und siehst jederzeit, wie weit du schon gekommen bist.
- Hake zuerst die Arten ab, die du schon gesehen hast, und trage dann neue Beobachtungen ein, sobald du sie machst.
button: 300 Schwedische Vögel öffnen
link: ${DOMAIN}/home
after:
- Fragen oder Ideen? Antworte einfach auf diese E-Mail.
signature: |-
  Viel Freude beim Beobachten!
  Joachim Klahr
reason: Du erhältst diese E-Mail, weil mit dieser Adresse ein Konto auf 300sf.se erstellt wurde. Warst du das nicht? Antworte auf diese E-Mail, dann entfernen wir das Konto.
