after:
- Der Link ist eine Stunde gültig. Dein Konto wird sofort geschlossen und nach 7 Tagen endgültig gelöscht, zusammen mit deinen Checklisten und Beobachtungen. Bis dahin kannst du uns kontaktieren, falls du es dir anders überlegst.
- Wenn du das nicht angefordert hast, kannst du diese E-Mail ignorieren. Jemand könnte dein Passwort kennen, ändere es also am besten.
reason: Du erhältst diese E-Mail, weil die Löschung deines Kontos auf 300sf.se angefordert wurde.
