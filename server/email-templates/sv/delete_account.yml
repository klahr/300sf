heading: Bekräfta att du vill ta bort ditt konto
body:
- Du har bett om att få ta bort ditt konto på 300 Svenska Fåglar. Gå vidare med knappen nedan och ange ditt lösenord.
button: Ta bort mitt konto
link: ${LINK}
show_link: true
after:
- Länken gäller i en timme. Kontot stängs direkt och raderas permanent efter 7 dagar, tillsammans med dina checklistor och observationer. Fram till dess kan du kontakta oss om du ångrar dig.
- Om du inte bad om detta kan du bortse från mejlet. Någon kan känna till ditt lösenord, så byt det gärna.
reason: Du får det här mejlet eftersom någon begärde att ditt konto på 300sf.se ska tas bort.
